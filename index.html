<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Chat Application</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- Monaco Editor -->
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css">
  <script>var require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' } };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.nls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.js"></script>

  <style>
    :root {
      --win11-accent: #0078d4;
      --win11-accent-hover: #106ebe;
      --win11-glass: rgba(15, 23, 42, 0.75);
      --win11-glass-card: rgba(255, 255, 255, 0.08);
      --win11-border: rgba(255, 255, 255, 0.18);
      --win11-font: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, sans-serif;
      --anim-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--win11-font);
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: #f8fafc;
    }

    .win11-fullscreen-window {
      width: 100vw; height: 100vh;
      background: var(--win11-glass);
      backdrop-filter: blur(32px) saturate(200%);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
    .win11-toast {
      background: rgba(30, 41, 59, 0.95); border: 1px solid var(--win11-border);
      backdrop-filter: blur(16px); padding: 12px 20px; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); color: #fff; font-size: 13px;
      display: flex; align-items: center; gap: 12px; animation: toastSpring 0.4s var(--anim-spring) forwards;
    }
    @keyframes toastSpring { 0% { opacity: 0; transform: translateX(60px) scale(0.9); } 100% { opacity: 1; transform: translateX(0) scale(1); } }

    .title-bar {
      height: 40px; background: rgba(0, 0, 0, 0.25); display: flex;
      justify-content: space-between; align-items: center; padding: 0 16px;
      border-bottom: 1px solid var(--win11-border); user-select: none;
    }
    .title-brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #f1f5f9; }
    .brand-tag { background: var(--win11-accent); color: white; font-size: 10px; padding: 2px 8px; border-radius: 12px; }

    .app-main { flex: 1; padding: 16px; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    .tab-pane { display: none; flex-direction: column; height: 100%; gap: 12px; animation: paneSpring 0.4s var(--anim-spring) forwards; }
    @keyframes paneSpring { 0% { opacity: 0; transform: translateY(12px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .tab-pane.active { display: flex; }

    .bottom-taskbar {
      height: 60px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px);
      border-top: 1px solid var(--win11-border); display: flex; justify-content: center;
      align-items: center; gap: 10px; padding: 0 16px; z-index: 50;
    }
    .taskbar-item {
      height: 42px; padding: 0 14px; border: 1px solid transparent; background: rgba(255, 255, 255, 0.05);
      border-radius: 10px; color: #94a3b8; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 0px; transition: all 0.35s var(--anim-spring); overflow: hidden;
    }
    .taskbar-item i { font-size: 18px; }
    .taskbar-label { max-width: 0; opacity: 0; white-space: nowrap; font-size: 13px; font-weight: 600; transition: all 0.35s var(--anim-spring); }
    .taskbar-item:hover { background: rgba(255, 255, 255, 0.15); color: #fff; border-color: var(--win11-border); gap: 10px; transform: translateY(-2px); }
    .taskbar-item:hover .taskbar-label { max-width: 140px; opacity: 1; }
    .taskbar-item.active { background: rgba(0, 120, 212, 0.3); color: #38bdf8; border-color: var(--win11-accent); }
    .taskbar-item.active:hover .taskbar-label { max-width: 140px; opacity: 1; }

    /* VS Code UI Container */
    .vscode-container {
      display: flex; height: 100%; border-radius: 12px; overflow: hidden;
      border: 1px solid #334155; background: #1e1e1e; font-family: 'Consolas', 'Courier New', monospace;
    }
    .vscode-sidebar {
      width: 220px; background: #252526; border-right: 1px solid #333333;
      display: flex; flex-direction: column; padding: 10px 0; color: #cccccc;
    }
    .vscode-file-item {
      padding: 8px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center;
      gap: 8px; transition: background 0.2s;
    }
    .vscode-file-item:hover { background: #2a2d2e; }
    .vscode-file-item.active { background: #37373d; color: #ffffff; font-weight: 600; }
    .vscode-editor-wrapper { flex: 1; display: flex; flex-direction: column; }
    .vscode-toolbar {
      height: 38px; background: #2d2d2d; display: flex; justify-content: space-between;
      align-items: center; padding: 0 14px; border-bottom: 1px solid #333333; color: #9cdcfe;
    }

    /* Profile Banner & Hover Avatar */
    .profile-card-banner {
      background: var(--win11-glass-card); border: 1px solid var(--win11-border);
      border-radius: 16px; overflow: hidden; max-width: 650px; width: 100%; margin: auto; display: flex; flex-direction: column;
    }
    .banner-container { height: 180px; background: linear-gradient(135deg, #0284c7, #0d9488); background-size: cover; background-position: center; position: relative; }
    .avatar-hover-wrapper { position: relative; width: 110px; height: 110px; margin-top: -55px; cursor: pointer; }
    .profile-avatar-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #0f172a; }
    .avatar-hover-overlay {
      position: absolute; top: 0; left: 0; width: 110px; height: 110px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #facc15; font-size: 11px; font-weight: 700; opacity: 0; transition: opacity 0.25s;
    }
    .avatar-hover-wrapper:hover .avatar-hover-overlay { opacity: 1; }

    /* Chat Messages */
    .chat-layout { display: flex; gap: 14px; height: 100%; overflow: hidden; }
    .chat-main-area { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .messages-container {
      flex: 1; background: var(--win11-glass-card); border-radius: 14px;
      border: 1px solid var(--win11-border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .msg-card { display: flex; align-items: flex-start; gap: 10px; animation: msgSpring 0.3s var(--anim-spring) forwards; }
    @keyframes msgSpring { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); cursor: pointer; transition: transform 0.2s; }
    .avatar:hover { transform: scale(1.1); }
    .msg-body { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid var(--win11-border); border-radius: 12px; padding: 10px 14px; max-width: 80%; }
    .msg-author { font-size: 12px; font-weight: 700; color: #38bdf8; cursor: pointer; margin-bottom: 2px; }

    .win11-input {
      width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--win11-border);
      background: rgba(255, 255, 255, 0.08); color: #ffffff; font-size: 13px; outline: none; font-family: inherit;
    }
    .win11-btn {
      padding: 10px 18px; border-radius: 10px; border: none; background: var(--win11-accent);
      color: white; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.25s;
    }
    .win11-btn:hover { background: var(--win11-accent-hover); transform: translateY(-2px); }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px); z-index: 999; justify-content: center; align-items: center;
    }

    /* GOOGLE CROP UI */
    .google-crop-card {
      background: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 28px;
      width: 520px;
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .google-crop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      color: #e3e3e3;
    }
    .google-crop-header h3 { font-size: 18px; font-weight: 400; }
    .google-crop-header-btn {
      background: none; border: none; color: #c4c7c5; font-size: 18px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .google-crop-header-btn:hover { background: rgba(255,255,255,0.1); }

    .google-crop-workspace {
      height: 320px;
      background: #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .cropper-view-box, .cropper-face {
      border-radius: 50% !important;
      outline: 2px solid #ffffff !important;
    }

    .google-crop-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 24px 24px;
      gap: 16px;
      background: #1e1e1e;
    }

    .google-rotate-btn {
      background: #2b2b2b;
      border: none;
      color: #e3e3e3;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .google-rotate-btn:hover { background: #383838; }

    .google-pill-next-btn {
      background: #a8c7fa;
      color: #040e15;
      font-weight: 600;
      border: none;
      padding: 10px 28px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .google-pill-next-btn:hover { background: #c2e7ff; transform: scale(1.02); }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="win11-fullscreen-window">
    <div class="title-bar">
      <div class="title-brand">
        <i class="fa-solid fa-comments"></i>
        <span>Global Chat Application</span>
        <span class="brand-tag">notcontentkitohio</span>
      </div>
      <div class="win-controls">
        <span class="win-btn-ctrl min"></span>
        <span class="win-btn-ctrl max"></span>
        <span class="win-btn-ctrl close"></span>
      </div>
    </div>

    <div class="app-main">
      <!-- 1. AUTH PANE -->
      <div id="paneAuth" class="tab-pane active">
        <div style="background: var(--win11-glass-card); border: 1px solid var(--win11-border); padding: 32px; border-radius: 16px; max-width: 400px; width: 100%; margin: auto; display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--win11-border); padding-bottom: 8px;">
            <button id="btnAuthLogin" type="button" class="win11-btn" style="flex: 1;" onclick="switchAuthTab('login')">Đăng Nhập</button>
            <button id="btnAuthReg" type="button" class="win11-btn" style="flex: 1; background: transparent;" onclick="switchAuthTab('reg')">Đăng Ký</button>
          </div>

          <div id="formLogin" style="display: flex; flex-direction: column; gap: 10px;">
            <input type="email" id="loginEmail" class="win11-input" placeholder="Email">
            <input type="password" id="loginPassword" class="win11-input" placeholder="Mật khẩu">
            <button type="button" class="win11-btn" onclick="handleLogin()"><i class="fa-solid fa-check"></i> Đăng Nhập</button>
          </div>

          <div id="formReg" style="display: none; flex-direction: column; gap: 10px;">
            <input type="text" id="regUser" class="win11-input" placeholder="Tên hiển thị">
            <input type="email" id="regEmail" class="win11-input" placeholder="Email">
            <input type="password" id="regPass" class="win11-input" placeholder="Mật khẩu">
            <button type="button" class="win11-btn" onclick="handleRegister()"><i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản</button>
          </div>
        </div>
      </div>

      <!-- 2. CHAT PANE -->
      <div id="paneChat" class="tab-pane">
        <div class="chat-layout">
          <div class="chat-main-area">
            <div class="messages-container" id="msgBox"></div>

            <div style="display: flex; gap: 8px; align-items: center;">
              <input type="file" id="fileAttachmentInput" style="display: none;" onchange="handleFileSelected(event)">
              <button class="win11-btn" style="padding: 10px 14px; background: rgba(255,255,255,0.1);" onclick="document.getElementById('fileAttachmentInput').click()"><i class="fa-solid fa-paperclip"></i></button>
              <input type="text" id="msgInput" class="win11-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendMsg()">
              <button class="win11-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
            </div>
          </div>

          <div style="width: 200px; background: var(--win11-glass-card); border: 1px solid var(--win11-border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
            <h4 style="font-size: 13px; color: #38bdf8;"><i class="fa-solid fa-circle" style="color: #22c55e; font-size: 10px;"></i> Trực Tuyến (<span id="onlineCount">0</span>)</h4>
            <div id="onlineUsersList" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto;"></div>
          </div>
        </div>
      </div>

      <!-- 3. PROFILE PANE -->
      <div id="paneProfile" class="tab-pane">
        <div class="profile-card-banner">
          <div class="banner-container" id="myBannerDisplay">
            <input type="file" id="bannerFileInput" accept="image/*" style="display: none;" onchange="handleBannerSelect(event)">
            <button style="position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--win11-border); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;" onclick="document.getElementById('bannerFileInput').click()">
              <i class="fa-solid fa-camera"></i> Change cover photo
            </button>
          </div>

          <div style="padding: 0 24px 20px; display: flex; flex-direction: column; gap: 12px;">
            <div class="avatar-hover-wrapper" onclick="openCropModal()">
              <img id="myAvatarDisplay" class="profile-avatar-img" src="">
              <div class="avatar-hover-overlay">
                <i class="fa-solid fa-camera" style="font-size: 18px;"></i>
                <span>TÙY CHỈNH</span>
              </div>
            </div>

            <div>
              <h2 id="myUsernameDisplay" style="font-size: 20px; font-weight: 700; color: #ffffff;">User</h2>
              <p id="myRoleBadgeDisplay" style="font-size: 12px; color: #f59e0b; font-weight: 700; margin-top: 2px;"></p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
              <input type="text" id="editUsernameInput" class="win11-input" placeholder="Tên hiển thị">
              <textarea id="editBioInput" class="win11-input" rows="3" placeholder="Tiểu sử (Bio)..."></textarea>
              <button class="win11-btn" onclick="saveProfileChanges()"><i class="fa-solid fa-floppy-disk"></i> Lưu Hồ Sơ</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. FRIENDS PANE -->
      <div id="paneFriends" class="tab-pane">
        <div style="background: var(--win11-glass-card); border: 1px solid var(--win11-border); padding: 24px; border-radius: 16px; height: 100%; display: flex; flex-direction: column; gap: 12px;">
          <h3 style="font-size: 16px; color: #38bdf8;"><i class="fa-solid fa-user-group"></i> Danh Sách Bạn Bè</h3>
          <div id="friendsList" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
            <p style="font-size: 13px; color: #94a3b8;">Chưa có bạn bè nào.</p>
          </div>
        </div>
      </div>

      <!-- 5. SETTINGS & VS CODE PANE -->
      <div id="paneSettings" class="tab-pane">
        <div style="background: var(--win11-glass-card); border: 1px solid var(--win11-border); border-radius: 16px; padding: 20px; height: 100%; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;">
          <h3 style="font-size: 16px; color: #38bdf8;"><i class="fa-solid fa-gear"></i> Cài Đặt Hệ Thống & Trình Chỉnh Sửa Code</h3>

          <div style="display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px;">
            <input type="password" id="ownerPasscodeKey" class="win11-input" placeholder="Nhập Secret Owner Passcode...">
            <button class="win11-btn" onclick="claimOwnerRole()"><i class="fa-solid fa-crown"></i> Kích Hoạt Owner</button>
            <button class="win11-btn" style="background: #ef4444;" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
          </div>

          <div id="vsCodeSection" style="display: none; flex: 1; flex-direction: column; gap: 8px;">
            <h4 style="font-size: 14px; color: #f59e0b;"><i class="fa-solid fa-code"></i> Visual Studio Code Web Editor (Owner Only)</h4>
            <div class="vscode-container">
              <div class="vscode-sidebar">
                <div style="padding: 6px 12px; font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase;">EXPLORER: GLOBAL-CHAT</div>
                <div class="vscode-file-item active" id="fileTabHtml" onclick="loadVsCodeFile('index.html')"><i class="fa-brands fa-html5" style="color: #e34c26;"></i> index.html</div>
                <div class="vscode-file-item" id="fileTabJs" onclick="loadVsCodeFile('server.js')"><i class="fa-brands fa-node-js" style="color: #68a063;"></i> server.js</div>
                <div class="vscode-file-item" id="fileTabJson" onclick="loadVsCodeFile('package.json')"><i class="fa-solid fa-code" style="color: #f1e05a;"></i> package.json</div>
              </div>

              <div class="vscode-editor-wrapper">
                <div class="vscode-toolbar">
                  <span id="currentEditingFileName"><i class="fa-brands fa-html5"></i> index.html</span>
                  <button class="win11-btn" style="padding: 4px 12px; font-size: 12px; background: #238636;" onclick="saveVsCodeFile()"><i class="fa-solid fa-floppy-disk"></i> Lưu & Cập Nhật Code Data</button>
                </div>
                <div id="monacoEditorContainer" style="flex: 1; width: 100%;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-taskbar" id="bottomTaskbar" style="display: none;">
      <button class="taskbar-item active" onclick="switchNav('chat')"><i class="fa-solid fa-comments"></i><span class="taskbar-label">Phòng Chat</span></button>
      <button class="taskbar-item" onclick="switchNav('profile')"><i class="fa-solid fa-id-card"></i><span class="taskbar-label">Hồ Sơ</span></button>
      <button class="taskbar-item" onclick="switchNav('friends')"><i class="fa-solid fa-user-group"></i><span class="taskbar-label">Bạn Bè</span></button>
      <button class="taskbar-item" onclick="switchNav('settings')"><i class="fa-solid fa-gear"></i><span class="taskbar-label">Cài Đặt & Code</span></button>
    </div>
  </div>

  <!-- MODAL PROFILE NGƯỜI KHÁC -->
  <div id="userProfileModal" class="modal-overlay">
    <div class="google-crop-card" style="width: 380px; padding: 24px; text-align: center; position: relative;">
      <button class="google-crop-header-btn" style="position: absolute; top: 12px; right: 12px;" onclick="closeModal('userProfileModal')"><i class="fa-solid fa-xmark"></i></button>
      <img id="targetUserAvatar" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #a8c7fa; margin: 10px auto;" src="">
      <h3 id="targetUserName" style="color: #a8c7fa; font-size: 18px;"></h3>
      <p id="targetUserBio" style="font-size: 12px; color: #c4c7c5; margin: 8px 0 16px;"></p>
      <button class="google-pill-next-btn" style="width: 100%;" onclick="sendFriendRequest()"><i class="fa-solid fa-user-plus"></i> Gửi Lời Mời Kết Bạn</button>
    </div>
  </div>

  <!-- GOOGLE ACCOUNT CẮT VÀ XOAY CROP MODAL (ẢNH 2 CHUẨN UI) -->
  <div id="cropModal" class="modal-overlay">
    <div class="google-crop-card">
      <div class="google-crop-header">
        <button class="google-crop-header-btn" onclick="closeModal('cropModal')"><i class="fa-solid fa-arrow-left"></i></button>
        <h3>Cắt và xoay</h3>
        <button class="google-crop-header-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>

      <div class="google-crop-workspace">
        <input type="file" id="cropFileInput" accept="image/*" style="display: none;" onchange="loadCropImage(event)">
        <img id="cropImageTarget" src="" style="max-width: 100%; max-height: 100%;">
      </div>

      <div class="google-crop-footer">
        <button class="google-rotate-btn" onclick="rotateCropImage()">
          <i class="fa-solid fa-rotate-left" style="font-size: 16px;"></i>
          <span>Xoay</span>
        </button>

        <button class="google-pill-next-btn" onclick="applyCroppedAvatar()">Tiếp theo</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    let me = null;
    let cropper = null;
    let monacoEditor = null;
    let currentEditingFile = 'index.html';
    let selectedTargetUser = null;

    function showToast(text, icon = 'fa-circle-check') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'win11-toast';
      toast.innerHTML = `<i class="fa-solid ${icon}" style="color: #38bdf8;"></i> <span>${text}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    fetch('/api/me').then(r => r.json()).then(user => {
      if (user) { me = user; showMainApp(); }
    });

    function showMainApp() {
      document.getElementById('paneAuth').classList.remove('active');
      document.getElementById('bottomTaskbar').style.display = 'flex';
      switchNav('chat');
      updateProfileUI();

      socket.emit('user_online', me);
      if (me.role === 'owner') {
        document.getElementById('vsCodeSection').style.display = 'flex';
        initMonacoEditor();
      }
    }

    function switchAuthTab(tab) {
      document.getElementById('btnAuthLogin').style.background = tab==='login' ? 'var(--win11-accent)' : 'transparent';
      document.getElementById('btnAuthReg').style.background = tab==='reg' ? 'var(--win11-accent)' : 'transparent';
      document.getElementById('formLogin').style.display = tab==='login' ? 'flex' : 'none';
      document.getElementById('formReg').style.display = tab==='reg' ? 'flex' : 'none';
    }

    function switchNav(pane) {
      document.querySelectorAll('.taskbar-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

      if (pane === 'chat') {
        document.querySelectorAll('.taskbar-item')[0].classList.add('active');
        document.getElementById('paneChat').classList.add('active');
      } else if (pane === 'profile') {
        document.querySelectorAll('.taskbar-item')[1].classList.add('active');
        document.getElementById('paneProfile').classList.add('active');
      } else if (pane === 'friends') {
        document.querySelectorAll('.taskbar-item')[2].classList.add('active');
        document.getElementById('paneFriends').classList.add('active');
        renderFriendsList();
      } else if (pane === 'settings') {
        document.querySelectorAll('.taskbar-item')[3].classList.add('active');
        document.getElementById('paneSettings').classList.add('active');
      }
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Vui lòng nhập Email và Mật khẩu!', 'fa-triangle-exclamation');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email, password })
        });
        const d = await res.json();
        if(d.success) { me = d.user; showMainApp(); showToast('Đăng nhập thành công!'); }
        else showToast(d.error, 'fa-triangle-exclamation');
      } catch (err) {
        showToast('Lỗi kết nối máy chủ! Hãy đợi vài giây thử lại.', 'fa-triangle-exclamation');
      }
    }

    async function handleRegister() {
      const regUser = document.getElementById('regUser').value;
      const regEmail = document.getElementById('regEmail').value;
      const regPass = document.getElementById('regPass').value;

      if (!regUser || !regEmail || !regPass) {
        showToast('Vui lòng điền đầy đủ thông tin!', 'fa-triangle-exclamation');
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username: regUser, email: regEmail, password: regPass })
        });
        const d = await res.json();

        if (d.success) {
          me = d.user;
          showMainApp();
          showToast('Đăng ký thành công! Chào mừng bạn.');
        } else {
          showToast(d.error, 'fa-triangle-exclamation');
        }
      } catch (err) {
        showToast('Lỗi khi đăng ký!', 'fa-triangle-exclamation');
      }
    }

    function claimOwnerRole() {
      const secretKey = document.getElementById('ownerPasscodeKey').value;
      fetch('/api/claim-owner', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ secretKey })
      }).then(r => r.json()).then(d => {
        if(d.success) {
          me = d.user; updateProfileUI();
          showToast('👑 Bạn đã kích hoạt quyền Owner!');
          location.reload();
        } else showToast(d.error, 'fa-triangle-exclamation');
      });
    }

    function handleLogout() { fetch('/api/logout').then(() => location.reload()); }

    function updateProfileUI() {
      if(!me) return;
      document.getElementById('myAvatarDisplay').src = me.avatar;
      document.getElementById('myUsernameDisplay').innerText = me.username;
      document.getElementById('myRoleBadgeDisplay').innerText = me.role === 'owner' ? '👑 OWNER (Chủ Sở Hữu)' : 'Thành viên';
      document.getElementById('editUsernameInput').value = me.username;
      document.getElementById('editBioInput').value = me.bio || '';
      if (me.banner) document.getElementById('myBannerDisplay').style.backgroundImage = `url(${me.banner})`;
    }

    function handleBannerSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          fetch('/api/update-profile', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ banner: evt.target.result })
          }).then(r => r.json()).then(d => {
            if(d.success) { me = d.user; updateProfileUI(); showToast('Cập nhật ảnh bìa thành công!'); }
          });
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProfileChanges() {
      fetch('/api/update-profile', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('editUsernameInput').value,
          bio: document.getElementById('editBioInput').value
        })
      }).then(r => r.json()).then(d => {
        if(d.success) { me = d.user; updateProfileUI(); showToast('Đã lưu hồ sơ!'); }
      });
    }

    function initMonacoEditor() {
      require(['vs/editor/editor.main'], function () {
        monacoEditor = monaco.editor.create(document.getElementById('monacoEditorContainer'), {
          value: '<!-- Đang tải code... -->',
          language: 'html',
          theme: 'vs-dark',
          automaticLayout: true,
          fontSize: 13
        });
        loadVsCodeFile('index.html');
      });
    }

    function loadVsCodeFile(filename) {
      currentEditingFile = filename;
      document.querySelectorAll('.vscode-file-item').forEach(e => e.classList.remove('active'));
      if(filename === 'index.html') document.getElementById('fileTabHtml').classList.add('active');
      if(filename === 'server.js') document.getElementById('fileTabJs').classList.add('active');
      if(filename === 'package.json') document.getElementById('fileTabJson').classList.add('active');

      document.getElementById('currentEditingFileName').innerText = filename;

      fetch(`/api/editor/get-file?filename=${filename}`)
        .then(r => r.json())
        .then(d => {
          if (d.success && monacoEditor) {
            let lang = 'html';
            if (filename.endsWith('.js')) lang = 'javascript';
            if (filename.endsWith('.json')) lang = 'json';

            monaco.editor.setModelLanguage(monacoEditor.getModel(), lang);
            monacoEditor.setValue(d.content);
          }
        });
    }

    function saveVsCodeFile() {
      if (!monacoEditor) return;
      const content = monacoEditor.getValue();
      fetch('/api/editor/save-file', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ filename: currentEditingFile, content })
      }).then(r => r.json()).then(d => {
        if (d.success) showToast(`Đã lưu ${currentEditingFile} thành công!`);
        else showToast(d.error, 'fa-triangle-exclamation');
      });
    }

    function openCropModal() {
      document.getElementById('cropFileInput').click();
    }

    function loadCropImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = document.getElementById('cropImageTarget');
          img.src = evt.target.result;
          document.getElementById('cropModal').style.display = 'flex';
          if (cropper) cropper.destroy();
          cropper = new Cropper(img, {
            aspectRatio: 1,
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 0.8,
            restore: false,
            guides: false,
            center: true,
            highlight: false,
            cropBoxMovable: true,
            cropBoxResizable: true,
            toggleDragModeOnDblclick: false
          });
        };
        reader.readAsDataURL(file);
      }
    }

    function rotateCropImage() {
      if (cropper) cropper.rotate(-90);
    }

    function applyCroppedAvatar() {
      if (cropper) {
        const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
        fetch('/api/update-profile', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ avatar: canvas.toDataURL('image/png') })
        }).then(r => r.json()).then(d => {
          if(d.success) { me = d.user; updateProfileUI(); closeModal('cropModal'); showToast('Đã đổi avatar!'); }
        });
      }
    }

    function openUserProfileModal(msg) {
      selectedTargetUser = msg;
      document.getElementById('targetUserAvatar').src = msg.avatar;
      document.getElementById('targetUserName').innerText = msg.user;
      document.getElementById('targetUserBio').innerText = "Thành viên Global Chat";
      document.getElementById('userProfileModal').style.display = 'flex';
    }

    function sendFriendRequest() {
      if (selectedTargetUser && me) {
        socket.emit('send_friend_request', {
          targetUserId: selectedTargetUser.userId,
          fromUserId: me.id
        });
        showToast(`Đã gửi lời mời kết bạn tới ${selectedTargetUser.user}!`);
        closeModal('userProfileModal');
      }
    }

    function mentionUser(username) {
      const input = document.getElementById('msgInput');
      input.value += `@${username} `;
      input.focus();
    }

    function renderMsg(msg) {
      const box = document.getElementById('msgBox');
      const card = document.createElement('div');
      card.className = 'msg-card';
      const safeData = JSON.stringify(msg).replace(/'/g, "&apos;");

      let roleBadge = '';
      if (msg.role === 'owner') roleBadge = '<span style="background:#f59e0b; color:#000; font-size:10px; padding:2px 6px; border-radius:6px; font-weight:bold;">OWNER</span>';

      card.innerHTML = `
        <img src="${msg.avatar}" class="avatar" onclick='openUserProfileModal(${safeData})'>
        <div class="msg-body">
          <div class="msg-author">
            <span onclick="mentionUser('${msg.user}')">${msg.user}</span> ${roleBadge}
          </div>
          <div style="font-size: 13px; color: #f1f5f9;">${msg.text}</div>
        </div>
      `;
      box.appendChild(card);
      box.scrollTop = box.scrollHeight;
    }

    socket.on('load_history', h => {
      document.getElementById('msgBox').innerHTML = '';
      h.forEach(m => renderMsg(m));
    });

    socket.on('receive_message', m => renderMsg(m));

    socket.on('update_online_list', (users) => {
      document.getElementById('onlineCount').innerText = users.length;
      document.getElementById('onlineUsersList').innerHTML = users.map(u => `
        <div style="font-size: 12px; font-weight: 600;">${u.username}</div>
      `).join('');
    });

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if (input.value.trim() && me) {
        socket.emit('send_message', {
          userId: me.id,
          user: me.username,
          role: me.role,
          avatar: me.avatar,
          text: input.value
        });
        input.value = '';
      }
    }

    function renderFriendsList() {
      const container = document.getElementById('friendsList');
      container.innerHTML = me && me.friends && me.friends.length > 0
        ? me.friends.map(f => `<div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">ID Bạn Bè: ${f}</div>`).join('')
        : `<p style="font-size: 13px; color: #94a3b8;">Chưa có bạn bè nào.</p>`;
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  </script>
</body>
</html>
