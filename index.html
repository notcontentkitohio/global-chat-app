<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Chat - Windows 11 UI by notcontentkitohio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --win11-glass: rgba(243, 243, 243, 0.90);
      --win11-accent: #0078d4;
      --win11-accent-hover: #106ebe;
      --win11-radius: 12px;
      --win11-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: linear-gradient(135deg, #0d1117, #161b22, #1f2937);
      background-size: 400% 400%;
      animation: gradientBg 15s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @keyframes gradientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .win11-window {
      width: 480px;
      height: 640px;
      background: var(--win11-glass);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--win11-radius);
      box-shadow: var(--win11-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: winOpen 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes winOpen {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .title-bar {
      height: 40px;
      background: rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      user-select: none;
    }

    .title-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .brand-tag {
      background: var(--win11-accent);
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .win-controls { display: flex; gap: 8px; }
    .win-btn { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .close { background: #ff5f56; }
    .minimize { background: #ffbd2e; }
    .maximize { background: #27c93f; }

    .app-content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .auth-box {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin: auto 0;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid #ddd;
      margin-bottom: 6px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .auth-tab-btn.active {
      color: var(--win11-accent);
      border-bottom: 2px solid var(--win11-accent);
      margin-bottom: -2px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: #444;
    }

    .win11-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .win11-input:focus {
      background: #ffffff;
      border-color: var(--win11-accent);
      box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.2);
    }

    .win11-btn {
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      background: var(--win11-accent);
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .win11-btn:hover { background: var(--win11-accent-hover); }

    .btn-discord { background: #5865F2; }
    .btn-discord:hover { background: #4752C4; }

    .btn-google { background: #4285F4; }
    .btn-google:hover { background: #3367D6; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #888;
      font-size: 11px;
      margin: 4px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ddd;
    }
    .divider span { padding: 0 8px; }

    .messages-container {
      flex: 1;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: msgPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes msgPop {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .msg-body {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      max-width: 82%;
    }

    .msg-author {
      font-size: 12px;
      font-weight: 700;
      color: var(--win11-accent);
      cursor: pointer;
      margin-bottom: 2px;
    }

    .msg-text {
      font-size: 13px;
      color: #222;
      word-break: break-word;
      line-height: 1.4;
    }

    .input-wrapper { display: flex; gap: 8px; }

    .footer-credit {
      text-align: center;
      font-size: 11px;
      color: #666;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.95);
      width: 340px;
      padding: 20px;
      border-radius: var(--win11-radius);
      box-shadow: var(--win11-shadow);
      text-align: center;
      position: relative;
    }

    .big-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      object-fit: cover; margin-bottom: 10px; border: 3px solid var(--win11-accent);
    }

    .crop-preview-box {
      width: 120px; height: 120px; border-radius: 50%;
      border: 3px solid var(--win11-accent); margin: 10px auto;
      overflow: hidden; background: #e0e0e0;
    }

    .crop-preview-img { width: 100%; height: 100%; object-fit: cover; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="win11-window">
    <div class="title-bar">
      <div class="title-brand">
        <i class="fa-solid fa-globe"></i>
        <span>Global Anonymous Chat</span>
        <span class="brand-tag">notcontentkitohio</span>
      </div>
      <div class="win-controls">
        <span class="win-btn minimize"></span>
        <span class="win-btn maximize"></span>
        <span class="win-btn close"></span>
      </div>
    </div>

    <div class="app-content">
      <!-- Màn hình Auth -->
      <div id="authScreen" class="auth-box">
        <div class="auth-tabs">
          <button class="auth-tab-btn active" onclick="switchAuthTab('login')"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
          <button class="auth-tab-btn" onclick="switchAuthTab('register')"><i class="fa-solid fa-user-plus"></i> Đăng ký</button>
        </div>

        <!-- Form Đăng Nhập -->
        <form id="loginForm" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 10px;">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" class="win11-input" placeholder="nhap@email.com" required>
          </div>
          <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="loginPassword" class="win11-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="win11-btn"><i class="fa-solid fa-check"></i> Xác nhận Đăng nhập</button>
        </form>

        <!-- Form Đăng Ký -->
        <form id="registerForm" onsubmit="handleRegister(event)" style="display: none; flex-direction: column; gap: 10px;">
          <div class="form-group">
            <label>Tên người dùng</label>
            <input type="text" id="regUsername" class="win11-input" placeholder="Tên hiển thị" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" class="win11-input" placeholder="nhap@email.com" required>
          </div>
          <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="regPassword" class="win11-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="win11-btn"><i class="fa-solid fa-user-check"></i> Tạo Tài Khoản</button>
        </form>

        <div class="divider"><span>hoặc đăng nhập nhanh bằng</span></div>

        <div style="display: flex; gap: 8px;">
          <button class="win11-btn btn-discord" style="flex: 1;" onclick="location.href='/auth/discord'">
            <i class="fa-brands fa-discord"></i> Discord
          </button>
          <button class="win11-btn btn-google" style="flex: 1;" onclick="location.href='/auth/google'">
            <i class="fa-brands fa-google"></i> Google
          </button>
        </div>
      </div>

      <!-- Màn hình Chat -->
      <div id="chatScreen" style="display: none; flex-direction: column; height: 100%; gap: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 12px; color: #444; font-weight: 600;">
            <i class="fa-solid fa-circle-dot" style="color: #28a745;"></i> Xin chào, <b id="currentUserDisplay" style="color: var(--win11-accent);">User</b>
          </span>
          <div>
            <button class="win11-btn" style="padding: 4px 8px; font-size: 11px;" onclick="openAvatarEditor()"><i class="fa-solid fa-image"></i> Đổi Avatar</button>
            <button class="win11-btn" style="padding: 4px 8px; font-size: 11px; background: #dc3545;" onclick="location.href='/auth/logout'"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
          </div>
        </div>

        <div class="messages-container" id="messageContainer"></div>

        <div class="input-wrapper">
          <input type="text" id="msgInput" class="win11-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="win11-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
        </div>
      </div>

      <div class="footer-credit">
        Powered by <b>notcontentkitohio</b> • Windows 11 UI
      </div>
    </div>
  </div>

  <!-- Modal Profile -->
  <div id="profileModal" class="modal-overlay">
    <div class="modal-card">
      <button style="position: absolute; top: 10px; right: 12px; border: none; background: none; cursor: pointer;" onclick="closeModal('profileModal')"><i class="fa-solid fa-xmark"></i></button>
      <img id="modalAvatar" class="big-avatar" src="" alt="Avatar">
      <h3 id="modalName" style="color: #111; margin-bottom: 4px;"></h3>
      <p id="modalId" style="font-size: 12px; color: #666; margin-bottom: 12px;"></p>
      <div style="background: rgba(0,120,212,0.08); padding: 8px; border-radius: 6px; font-size: 12px; color: var(--win11-accent); font-weight: 600;">
        <i class="fa-solid fa-wifi"></i> Đang hoạt động trên hệ thống
      </div>
    </div>
  </div>

  <!-- Modal Đổi Avatar -->
  <div id="avatarEditorModal" class="modal-overlay">
    <div class="modal-card">
      <button style="position: absolute; top: 10px; right: 12px; border: none; background: none; cursor: pointer;" onclick="closeModal('avatarEditorModal')"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="font-size: 14px; color: #111; margin-bottom: 10px;"><i class="fa-solid fa-pen-to-square"></i> Chỉnh Sửa Avatar</h3>

      <div class="crop-preview-box">
        <img id="avatarPreview" class="crop-preview-img" src="" alt="Preview">
      </div>

      <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        <button class="win11-btn" style="flex: 1; padding: 6px; font-size: 11px; background: #28a745;" onclick="document.getElementById('avatarFileInput').click()"><i class="fa-solid fa-upload"></i> Tải ảnh từ máy</button>
      </div>

      <input type="text" id="avatarUrlInput" class="win11-input" style="width: 100%; margin-bottom: 10px; font-size: 11px;" placeholder="Hoặc dán URL ảnh" oninput="handleUrlInput(event)">

      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="win11-btn" style="flex: 1; background: #6e6e6e;" onclick="closeModal('avatarEditorModal')">Hủy</button>
        <button class="win11-btn" style="flex: 1;" onclick="applyNewAvatar()"><i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let tempAvatarData = "";

    fetch('/api/me')
      .then(res => res.json())
      .then(user => {
        if (user) {
          currentUser = user;
          document.getElementById('currentUserDisplay').innerText = user.username;
          document.getElementById('authScreen').style.display = 'none';
          document.getElementById('chatScreen').style.display = 'flex';
        } else {
          document.getElementById('authScreen').style.display = 'flex';
          document.getElementById('chatScreen').style.display = 'none';
        }
      });

    function switchAuthTab(tab) {
      const btns = document.querySelectorAll('.auth-tab-btn');
      btns.forEach(b => b.classList.remove('active'));
      if (tab === 'login') {
        btns[0].classList.add('active');
        document.getElementById('loginForm').style.display = 'flex';
        document.getElementById('registerForm').style.display = 'none';
      } else {
        btns[1].classList.add('active');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'flex';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) location.reload();
        else alert('Đăng nhập thất bại!');
      });
    }

    function handleRegister(e) {
      e.preventDefault();
      fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('regUsername').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) location.reload();
        else alert(data.error || 'Đăng ký thất bại!');
      });
    }

    function renderMessage(data) {
      const container = document.getElementById('messageContainer');
      const msgElement = document.createElement('div');
      msgElement.className = 'msg-card';
      const safeData = JSON.stringify(data).replace(/'/g, "&apos;");

      msgElement.innerHTML = `
        <img src="${data.avatar}" class="avatar" onclick='viewProfile(${safeData})'>
        <div class="msg-body">
          <div class="msg-author" onclick='viewProfile(${safeData})'>${data.user}</div>
          <div class="msg-text">${data.text}</div>
        </div>
      `;
      container.appendChild(msgElement);
      container.scrollTop = container.scrollHeight;
    }

    socket.on('load_history', (history) => {
      const container = document.getElementById('messageContainer');
      container.innerHTML = '';
      history.forEach((data) => renderMessage(data));
    });

    socket.on('receive_message', (data) => renderMessage(data));

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if (input.value.trim() !== "" && currentUser) {
        socket.emit('send_message', {
          userId: currentUser.id,
          user: currentUser.username,
          avatar: currentUser.avatar,
          text: input.value
        });
        input.value = "";
      }
    }

    function openAvatarEditor() {
      tempAvatarData = currentUser.avatar;
      document.getElementById('avatarPreview').src = tempAvatarData;
      document.getElementById('avatarEditorModal').style.display = 'flex';
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          tempAvatarData = evt.target.result;
          document.getElementById('avatarPreview').src = tempAvatarData;
        };
        reader.readAsDataURL(file);
      }
    }

    function handleUrlInput(e) {
      const url = e.target.value.trim();
      if (url) {
        tempAvatarData = url;
        document.getElementById('avatarPreview').src = url;
      }
    }

    function applyNewAvatar() {
      currentUser.avatar = tempAvatarData;
      closeModal('avatarEditorModal');
    }

    function viewProfile(data) {
      document.getElementById('modalAvatar').src = data.avatar;
      document.getElementById('modalName').innerText = data.user;
      document.getElementById('modalId').innerText = "ID: " + (data.userId || "N/A");
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
