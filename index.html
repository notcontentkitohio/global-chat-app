<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Chat - Windows 11 Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Thư viện Cắt / Crop Ảnh Chuyên Nghiệp -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <style>
    :root {
      --win11-accent: #0078d4;
      --win11-accent-hover: #106ebe;
      --win11-bg-glass: rgba(248, 250, 252, 0.88);
      --win11-border: rgba(255, 255, 255, 0.6);
      --win11-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      --win11-radius: 14px;
      --win11-font: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--win11-font);
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .win11-window {
      width: 540px;
      height: 720px;
      background: var(--win11-bg-glass);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--win11-border);
      border-radius: var(--win11-radius);
      box-shadow: var(--win11-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: winPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes winPop {
      0% { opacity: 0; transform: scale(0.93) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .title-bar {
      height: 44px;
      background: rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      user-select: none;
    }

    .title-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
    }

    .brand-tag {
      background: var(--win11-accent);
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .win-controls { display: flex; gap: 8px; }
    .win-btn-ctrl { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .close { background: #ff5f56; }
    .min { background: #ffbd2e; }
    .max { background: #27c93f; }

    .nav-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.5);
      padding: 6px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      gap: 6px;
    }

    .nav-item {
      flex: 1;
      padding: 8px;
      border: none;
      background: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-item.active {
      background: #ffffff;
      color: var(--win11-accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transform: translateY(-1px);
    }

    .nav-item:hover:not(.active) {
      background: rgba(255,255,255,0.4);
      color: #1e293b;
    }

    .app-content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      position: relative;
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      height: 100%;
      gap: 12px;
      animation: tabFadeIn 0.3s ease forwards;
    }

    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tab-pane.active { display: flex; }

    /* Inputs & Buttons */
    .win11-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .win11-input:focus {
      background: #ffffff;
      border-color: var(--win11-accent);
      box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.2);
    }

    .win11-btn {
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      background: var(--win11-accent);
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .win11-btn:hover {
      background: var(--win11-accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,120,212,0.25);
    }

    .win11-btn:active { transform: translateY(0); }

    /* Messages UI */
    .messages-container {
      flex: 1;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: msgPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes msgPop {
      0% { opacity: 0; transform: translateY(10px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .avatar:hover { transform: scale(1.08); }

    .msg-body {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 9px 13px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      max-width: 82%;
    }

    .msg-author {
      font-size: 12px;
      font-weight: 700;
      color: var(--win11-accent);
      cursor: pointer;
      margin-bottom: 2px;
    }

    .msg-text {
      font-size: 13px;
      color: #0f172a;
      word-break: break-word;
      line-height: 1.4;
    }

    /* Profile UI */
    .profile-card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .profile-avatar-wrapper {
      position: relative;
      cursor: pointer;
    }

    .profile-avatar-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--win11-accent);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      transition: filter 0.2s;
    }

    .profile-avatar-wrapper:hover .profile-avatar-img {
      filter: brightness(0.85);
    }

    .avatar-edit-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .profile-avatar-wrapper:hover .avatar-edit-overlay {
      opacity: 1;
    }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: modalFade 0.25s ease forwards;
    }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.95);
      width: 380px;
      padding: 24px;
      border-radius: var(--win11-radius);
      box-shadow: var(--win11-shadow);
      position: relative;
      border: 1px solid var(--win11-border);
      animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .crop-container {
      width: 100%;
      height: 240px;
      background: #000;
      margin: 12px 0;
      border-radius: 8px;
      overflow: hidden;
    }

    .footer-credit {
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="win11-window">
    <div class="title-bar">
      <div class="title-brand">
        <i class="fa-solid fa-comments"></i>
        <span>Global Chat Application</span>
        <span class="brand-tag">notcontentkitohio</span>
      </div>
      <div class="win-controls">
        <span class="win-btn-ctrl min"></span>
        <span class="win-btn-ctrl max"></span>
        <span class="win-btn-ctrl close"></span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-bar" id="mainNav" style="display: none;">
      <button class="nav-item active" onclick="switchNav('chat')"><i class="fa-solid fa-message"></i> Phòng Chat</button>
      <button class="nav-item" onclick="switchNav('profile')"><i class="fa-solid fa-id-card"></i> Hồ Sơ Cá Nhân</button>
      <button class="nav-item" onclick="switchNav('friends')"><i class="fa-solid fa-user-group"></i> Bạn Bè</button>
    </div>

    <div class="app-content">
      <!-- 1. AUTH PANE -->
      <div id="paneAuth" class="tab-pane active">
        <div style="background: rgba(255,255,255,0.85); padding: 24px; border-radius: 12px; display: flex; flex-direction: column; gap: 14px; margin: auto 0;">
          <div style="display: flex; border-bottom: 2px solid #ddd; margin-bottom: 6px;">
            <button id="authBtnLogin" class="nav-item active" onclick="switchAuthTab('login')"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button>
            <button id="authBtnReg" class="nav-item" onclick="switchAuthTab('reg')"><i class="fa-solid fa-user-plus"></i> Đăng Ký</button>
          </div>

          <form id="formLogin" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 12px;">
            <input type="email" id="loginEmail" class="win11-input" placeholder="Địa chỉ Email" required>
            <input type="password" id="loginPassword" class="win11-input" placeholder="Mật khẩu" required>
            <button type="submit" class="win11-btn"><i class="fa-solid fa-check"></i> Đăng Nhập</button>
          </form>

          <form id="formReg" onsubmit="handleRegister(event)" style="display: none; flex-direction: column; gap: 12px;">
            <input type="text" id="regUser" class="win11-input" placeholder="Tên hiển thị" required>
            <input type="email" id="regEmail" class="win11-input" placeholder="Địa chỉ Email" required>
            <input type="password" id="regPass" class="win11-input" placeholder="Mật khẩu" required>
            <button type="submit" class="win11-btn"><i class="fa-solid fa-user-check"></i> Tạo Tài Khoản</button>
          </form>
        </div>
      </div>

      <!-- 2. CHAT PANE -->
      <div id="paneChat" class="tab-pane">
        <div class="messages-container" id="msgBox"></div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="msgInput" class="win11-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="win11-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
        </div>
      </div>

      <!-- 3. PROFILE PANE (Khung Hồ Sơ & Chỉnh Sửa) -->
      <div id="paneProfile" class="tab-pane">
        <div class="profile-card">
          <div class="profile-avatar-wrapper" onclick="openCropModal()">
            <img id="myAvatarDisplay" class="profile-avatar-img" src="" alt="Avatar">
            <div class="avatar-edit-overlay"><i class="fa-solid fa-camera"></i></div>
          </div>
          <h2 id="myUsernameDisplay" style="color: #0f172a; font-size: 18px; font-weight: 700;"></h2>
          <p id="myEmailDisplay" style="font-size: 12px; color: #64748b;"></p>

          <div style="width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
            <label style="font-size: 12px; font-weight: 600; color: #334155;">Tên hiển thị:</label>
            <input type="text" id="editUsernameInput" class="win11-input">

            <label style="font-size: 12px; font-weight: 600; color: #334155;">Tiểu sử (Bio):</label>
            <textarea id="editBioInput" class="win11-input" rows="3" style="resize: none;"></textarea>

            <button class="win11-btn" style="margin-top: 6px;" onclick="saveProfileChanges()"><i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi</button>
            <button class="win11-btn" style="background: #ef4444; margin-top: 4px;" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
          </div>
        </div>
      </div>

      <!-- 4. FRIENDS PANE -->
      <div id="paneFriends" class="tab-pane">
        <div style="background: rgba(255,255,255,0.85); padding: 16px; border-radius: 12px; height: 100%; display: flex; flex-direction: column; gap: 10px;">
          <h3 style="font-size: 14px; color: #0f172a;"><i class="fa-solid fa-user-friends"></i> Danh Sách Bạn Bè</h3>
          <div id="friendsList" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            <p style="font-size: 12px; color: #888;">Chưa có bạn bè nào. Hãy bấm vào Avatar của người khác trong phòng Chat để gửi lời mời kết bạn!</p>
          </div>
        </div>
      </div>

      <div class="footer-credit">
        Powered by <b>notcontentkitohio</b> • Windows 11 UI
      </div>
    </div>
  </div>

  <!-- MODAL CẮT / CROP AVATAR -->
  <div id="cropModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="font-size: 15px; color: #0f172a;"><i class="fa-solid fa-crop-simple"></i> Cắt & Chỉnh Sửa Avatar</h3>
      <div style="margin-top: 10px;">
        <input type="file" id="cropFileInput" accept="image/*" class="win11-input" onchange="loadCropImage(event)">
      </div>
      <div class="crop-container">
        <img id="cropImageTarget" src="" style="max-width: 100%;">
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="win11-btn" style="flex: 1; background: #64748b;" onclick="closeModal('cropModal')">Hủy</button>
        <button class="win11-btn" style="flex: 1;" onclick="applyCroppedAvatar()"><i class="fa-solid fa-check"></i> Áp Dụng</button>
      </div>
    </div>
  </div>

  <!-- MODAL XEM PROFILE NGƯỜI KHÁC & KẾT BẠN -->
  <div id="userProfileModal" class="modal-overlay">
    <div class="modal-card" style="text-align: center;">
      <button style="position: absolute; top: 12px; right: 14px; border: none; background: none; cursor: pointer; color: #888;" onclick="closeModal('userProfileModal')"><i class="fa-solid fa-xmark"></i></button>
      <img id="targetAvatar" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--win11-accent); margin-bottom: 8px;" src="">
      <h3 id="targetName" style="color: #0f172a; font-size: 16px;"></h3>
      <p id="targetBio" style="font-size: 12px; color: #64748b; margin: 6px 0 14px;"></p>
      <button id="addFriendBtn" class="win11-btn" style="width: 100%;" onclick="sendFriendRequest()"><i class="fa-solid fa-user-plus"></i> Kết Bạn</button>
    </div>
  </div>

  <script>
    const socket = io();
    let me = null;
    let cropper = null;
    let selectedTargetUser = null;

    // Fetch user
    fetch('/api/me').then(r => r.json()).then(user => {
      if (user) {
        me = user;
        showMainApp();
      }
    });

    function showMainApp() {
      document.getElementById('paneAuth').classList.remove('active');
      document.getElementById('mainNav').style.display = 'flex';
      switchNav('chat');
      updateProfileUI();
    }

    function switchAuthTab(tab) {
      document.getElementById('authBtnLogin').classList.toggle('active', tab==='login');
      document.getElementById('authBtnReg').classList.toggle('active', tab==='reg');
      document.getElementById('formLogin').style.display = tab==='login' ? 'flex' : 'none';
      document.getElementById('formReg').style.display = tab==='reg' ? 'flex' : 'none';
    }

    function switchNav(pane) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

      if (pane === 'chat') {
        document.querySelectorAll('.nav-item')[0].classList.add('active');
        document.getElementById('paneChat').classList.add('active');
      } else if (pane === 'profile') {
        document.querySelectorAll('.nav-item')[1].classList.add('active');
        document.getElementById('paneProfile').classList.add('active');
      } else if (pane === 'friends') {
        document.querySelectorAll('.nav-item')[2].classList.add('active');
        document.getElementById('paneFriends').classList.add('active');
        renderFriendsList();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      }).then(r => r.json()).then(d => {
        if(d.success) { me = d.user; showMainApp(); }
        else alert(d.error);
      });
    }

    function handleRegister(e) {
      e.preventDefault();
      fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('regUser').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPass').value
        })
      }).then(r => r.json()).then(d => {
        if(d.success) { me = d.user; showMainApp(); }
        else alert(d.error);
      });
    }

    function handleLogout() {
      fetch('/api/logout').then(() => location.reload());
    }

    function updateProfileUI() {
      if(!me) return;
      document.getElementById('myAvatarDisplay').src = me.avatar;
      document.getElementById('myUsernameDisplay').innerText = me.username;
      document.getElementById('myEmailDisplay').innerText = me.email;
      document.getElementById('editUsernameInput').value = me.username;
      document.getElementById('editBioInput').value = me.bio || '';
    }

    function saveProfileChanges() {
      const username = document.getElementById('editUsernameInput').value;
      const bio = document.getElementById('editBioInput').value;

      fetch('/api/update-profile', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username, bio })
      }).then(r => r.json()).then(d => {
        if(d.success) {
          me = d.user;
          updateProfileUI();
          alert('Cập nhật hồ sơ thành công!');
        }
      });
    }

    // CROPPING LOGIC
    function openCropModal() {
      document.getElementById('cropModal').style.display = 'flex';
    }

    function loadCropImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = document.getElementById('cropImageTarget');
          img.src = evt.target.result;
          if (cropper) cropper.destroy();
          cropper = new Cropper(img, {
            aspectRatio: 1,
            viewMode: 1
          });
        };
        reader.readAsDataURL(file);
      }
    }

    function applyCroppedAvatar() {
      if (cropper) {
        const canvas = cropper.getCroppedCanvas({ width: 250, height: 250 });
        const croppedDataUrl = canvas.toDataURL('image/png');

        fetch('/api/update-profile', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ avatar: croppedDataUrl })
        }).then(r => r.json()).then(d => {
          if(d.success) {
            me = d.user;
            updateProfileUI();
            closeModal('cropModal');
          }
        });
      }
    }

    // CHAT & FRIENDS LOGIC
    function renderMsg(msg) {
      const box = document.getElementById('msgBox');
      const card = document.createElement('div');
      card.className = 'msg-card';
      const safe = JSON.stringify(msg).replace(/'/g, "&apos;");

      card.innerHTML = `
        <img src="${msg.avatar}" class="avatar" onclick='viewOtherUser(${safe})'>
        <div class="msg-body">
          <div class="msg-author" onclick='viewOtherUser(${safe})'>${msg.user}</div>
          <div class="msg-text">${msg.text}</div>
        </div>
      `;
      box.appendChild(card);
      box.scrollTop = box.scrollHeight;
    }

    socket.on('load_history', h => {
      document.getElementById('msgBox').innerHTML = '';
      h.forEach(m => renderMsg(m));
    });

    socket.on('receive_message', m => renderMsg(m));

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if (input.value.trim() && me) {
        socket.emit('send_message', {
          userId: me.id,
          user: me.username,
          avatar: me.avatar,
          text: input.value
        });
        input.value = '';
      }
    }

    function viewOtherUser(msg) {
      selectedTargetUser = msg;
      document.getElementById('targetAvatar').src = msg.avatar;
      document.getElementById('targetName').innerText = msg.user;
      document.getElementById('targetBio').innerText = "Thành viên Global Chat";
      document.getElementById('userProfileModal').style.display = 'flex';
    }

    function sendFriendRequest() {
      if (selectedTargetUser && me) {
        socket.emit('send_friend_request', {
          targetUserId: selectedTargetUser.userId,
          fromUserId: me.id
        });
        alert('Đã gửi lời mời kết bạn!');
        closeModal('userProfileModal');
      }
    }

    function renderFriendsList() {
      const container = document.getElementById('friendsList');
      if (me && me.friends && me.friends.length > 0) {
        container.innerHTML = me.friends.map(fId => `
          <div style="background: white; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 13px; font-weight: 600;">ID Bạn Bè: ${fId}</span>
            <span style="font-size: 11px; color: #22c55e;"><i class="fa-solid fa-circle"></i> Đã kết bạn</span>
          </div>
        `).join('');
      } else {
        container.innerHTML = `<p style="font-size: 12px; color: #888;">Chưa có bạn bè nào.</p>`;
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
