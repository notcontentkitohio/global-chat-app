<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Chat - Windows 11 Ultimate Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <style>
    :root {
      --win11-accent: #0078d4;
      --win11-accent-hover: #106ebe;
      --win11-glass: rgba(15, 23, 42, 0.72);
      --win11-glass-card: rgba(255, 255, 255, 0.08);
      --win11-border: rgba(255, 255, 255, 0.18);
      --win11-blur: 30px;
      --win11-font: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--win11-font);
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: #f8fafc;
    }

    .win11-fullscreen-window {
      width: 100vw;
      height: 100vh;
      background: var(--win11-glass);
      backdrop-filter: blur(var(--win11-blur)) saturate(200%);
      -webkit-backdrop-filter: blur(var(--win11-blur)) saturate(200%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toast Notification Fluent UI */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .win11-toast {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid var(--win11-border);
      backdrop-filter: blur(16px);
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .title-bar {
      height: 40px;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--win11-border);
      user-select: none;
    }

    .title-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .brand-tag {
      background: var(--win11-accent);
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .win-controls { display: flex; gap: 8px; }
    .win-btn-ctrl { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .close { background: #ff5f56; }
    .min { background: #ffbd2e; }
    .max { background: #27c93f; }

    .app-main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      height: 100%;
      gap: 12px;
      animation: paneFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes paneFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tab-pane.active { display: flex; }

    /* Bottom Taskbar Hover */
    .bottom-taskbar {
      height: 60px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(25px);
      border-top: 1px solid var(--win11-border);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      z-index: 50;
    }

    .taskbar-item {
      height: 42px;
      padding: 0 14px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .taskbar-item i { font-size: 18px; }

    .taskbar-label {
      max-width: 0;
      opacity: 0;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .taskbar-item:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: var(--win11-border);
      gap: 10px;
    }

    .taskbar-item:hover .taskbar-label {
      max-width: 140px;
      opacity: 1;
    }

    .taskbar-item.active {
      background: rgba(0, 120, 212, 0.3);
      color: #38bdf8;
      border-color: var(--win11-accent);
    }

    .taskbar-item.active:hover .taskbar-label {
      max-width: 140px;
      opacity: 1;
    }

    /* Banner Profile Card (Giống Ảnh 2 & 3) */
    .profile-card-banner {
      background: var(--win11-glass-card);
      border: 1px solid var(--win11-border);
      border-radius: 16px;
      overflow: hidden;
      max-width: 650px;
      width: 100%;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    .banner-container {
      height: 180px;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .change-cover-btn {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--win11-border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-info-header {
      padding: 0 24px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .avatar-hover-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-top: -55px;
      cursor: pointer;
    }

    .profile-avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0f172a;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    /* Discord Decoration Frame */
    .decoration-frame {
      position: absolute;
      top: -10px; left: -10px;
      width: 130px; height: 130px;
      pointer-events: none;
    }

    /* Hover Avatar Lớp Phủ Camera + TÙY CHỈNH (Chuẩn Ảnh 3) */
    .avatar-hover-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #facc15;
      font-size: 11px;
      font-weight: 700;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .avatar-hover-wrapper:hover .avatar-hover-overlay {
      opacity: 1;
    }

    /* Chat Elements */
    .chat-layout { display: flex; gap: 14px; height: 100%; overflow: hidden; }
    .chat-main-area { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .messages-container {
      flex: 1; background: var(--win11-glass-card); border-radius: 14px;
      border: 1px solid var(--win11-border); padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }

    .msg-card { display: flex; align-items: flex-start; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); cursor: pointer; }
    .msg-body { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid var(--win11-border); border-radius: 12px; padding: 10px 14px; max-width: 80%; }

    .win11-input {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--win11-border); background: rgba(255, 255, 255, 0.08);
      color: #ffffff; font-size: 13px; outline: none; font-family: inherit;
    }

    .win11-btn {
      padding: 10px 18px; border-radius: 10px; border: none;
      background: var(--win11-accent); color: white; font-weight: 600;
      font-size: 13px; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
    }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); z-index: 100;
      justify-content: center; align-items: center;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(25px);
      border: 1px solid var(--win11-border); width: 440px; padding: 24px; border-radius: 16px;
    }

    .cropper-view-box, .cropper-face { border-radius: 50% !important; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="win11-fullscreen-window">
    <div class="title-bar">
      <div class="title-brand">
        <i class="fa-solid fa-comments"></i>
        <span id="txtTitle">Global Chat Application - Ultimate Glass</span>
        <span class="brand-tag">notcontentkitohio</span>
      </div>
      <div class="win-controls">
        <span class="win-btn-ctrl min"></span>
        <span class="win-btn-ctrl max"></span>
        <span class="win-btn-ctrl close"></span>
      </div>
    </div>

    <div class="app-main">
      <!-- 1. AUTH PANE -->
      <div id="paneAuth" class="tab-pane active">
        <div style="background: var(--win11-glass-card); border: 1px solid var(--win11-border); padding: 32px; border-radius: 16px; max-width: 400px; width: 100%; margin: auto; display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--win11-border); padding-bottom: 8px;">
            <button id="btnAuthLogin" class="win11-btn" style="flex: 1;" onclick="switchAuthTab('login')">Đăng Nhập</button>
            <button id="btnAuthReg" class="win11-btn" style="flex: 1; background: transparent;" onclick="switchAuthTab('reg')">Đăng Ký</button>
          </div>

          <form id="formLogin" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 10px;">
            <input type="email" id="loginEmail" class="win11-input" placeholder="Email" required>
            <input type="password" id="loginPassword" class="win11-input" placeholder="Mật khẩu" required>
            <button type="submit" class="win11-btn"><i class="fa-solid fa-check"></i> Đăng Nhập</button>
          </form>

          <form id="formReg" onsubmit="handleRegister(event)" style="display: none; flex-direction: column; gap: 10px;">
            <input type="text" id="regUser" class="win11-input" placeholder="Tên hiển thị" required>
            <input type="email" id="regEmail" class="win11-input" placeholder="Email" required>
            <input type="password" id="regPass" class="win11-input" placeholder="Mật khẩu" required>
            <button type="submit" class="win11-btn"><i class="fa-solid fa-user-check"></i> Tạo Tài Khoản</button>
          </form>
        </div>
      </div>

      <!-- 2. CHAT PANE -->
      <div id="paneChat" class="tab-pane">
        <div class="chat-layout">
          <div class="chat-main-area">
            <div class="messages-container" id="msgBox"></div>

            <div id="replyIndicator" style="display: none; background: rgba(0,120,212,0.2); padding: 6px 12px; border-radius: 8px; font-size: 12px; justify-content: space-between; align-items: center;">
              <span><i class="fa-solid fa-reply"></i> Đang trả lời: <b id="replyTargetName">User</b></span>
              <button onclick="cancelReply()" style="background: none; border: none; color: #ff5f56; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div style="display: flex; gap: 8px; align-items: center;">
              <input type="file" id="fileAttachmentInput" style="display: none;" onchange="handleFileSelected(event)">
              <button class="win11-btn" style="padding: 10px 14px; background: rgba(255,255,255,0.1);" onclick="document.getElementById('fileAttachmentInput').click()"><i class="fa-solid fa-paperclip"></i></button>
              <input type="text" id="msgInput" class="win11-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendMsg()">
              <button class="win11-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
            </div>
          </div>

          <div style="width: 200px; background: var(--win11-glass-card); border: 1px solid var(--win11-border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
            <h4 style="font-size: 13px; color: #38bdf8;"><i class="fa-solid fa-circle" style="color: #22c55e; font-size: 10px;"></i> Trực Tuyến (<span id="onlineCount">0</span>)</h4>
            <div id="onlineUsersList" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto;"></div>
          </div>
        </div>
      </div>

      <!-- 3. PROFILE PANE (Banner + Hover Avatar Chuẩn Ảnh 2 & 3) -->
      <div id="paneProfile" class="tab-pane">
        <div class="profile-card-banner">
          <!-- Banner Image -->
          <div class="banner-container" id="myBannerDisplay">
            <input type="file" id="bannerFileInput" accept="image/*" style="display: none;" onchange="handleBannerSelect(event)">
            <button class="change-cover-btn" onclick="document.getElementById('bannerFileInput').click()">
              <i class="fa-solid fa-camera"></i> Change cover photo
            </button>
          </div>

          <div class="profile-info-header">
            <!-- Hover Avatar + Decoration Frame -->
            <div class="avatar-hover-wrapper" onclick="openCropModal()">
              <img id="myAvatarDisplay" class="profile-avatar-img" src="">
              <svg class="decoration-frame" id="myDecorationDisplay" viewBox="0 0 100 100" style="display: none;"></svg>
              <div class="avatar-hover-overlay">
                <i class="fa-solid fa-camera" style="font-size: 18px;"></i>
                <span>TÙY CHỈNH</span>
              </div>
            </div>

            <div>
              <h2 id="myUsernameDisplay" style="font-size: 20px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 6px;">
                User <i class="fa-solid fa-circle-check" style="color: #38bdf8; font-size: 16px;"></i>
              </h2>
              <p id="myEmailDisplay" style="font-size: 12px; color: #94a3b8;"></p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
              <input type="text" id="editUsernameInput" class="win11-input" placeholder="Tên hiển thị">
              <textarea id="editBioInput" class="win11-input" rows="3" placeholder="Tiểu sử (Bio)..."></textarea>
              <button class="win11-btn" onclick="saveProfileChanges()"><i class="fa-solid fa-floppy-disk"></i> Lưu Hồ Sơ</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. FRIENDS PANE -->
      <div id="paneFriends" class="tab-pane">
        <div style="background: var(--win11-glass-card); border: 1px solid var(--win11-border); padding: 24px; border-radius: 16px; height: 100%; display: flex; flex-direction: column; gap: 12px;">
          <h3 style="font-size: 16px; color: #38bdf8;"><i class="fa-solid fa-user-group"></i> Danh Sách Bạn Bè</h3>
          <div id="friendsList" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
            <p style="font-size: 13px; color: #94a3b8;">Chưa có bạn bè nào.</p>
          </div>
        </div>
      </div>

      <!-- 5. SETTINGS PANE (Đa Ngôn Ngữ + Discord Frame + Control) -->
      <div id="paneSettings" class="tab-pane">
        <div style="background: var(--win11-glass-card); border: 1px solid var(--win11-border); border-radius: 16px; padding: 24px; height: 100%; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">
          <h3 style="font-size: 16px; color: #38bdf8;"><i class="fa-solid fa-gear"></i> Cài Đặt & Trang Trí</h3>

          <div style="display: flex; flex-direction: column; gap: 12px; background: rgba(255,255,255,0.05); padding: 16px; border-radius: 12px;">
            <label style="font-size: 13px; font-weight: 600;"><i class="fa-solid fa-language"></i> Ngôn Ngữ (Language):</label>
            <select id="langSelect" class="win11-input" onchange="changeLanguage(this.value)">
              <option value="vi">Tiếng Việt (Vietnamese)</option>
              <option value="en">English (Tiếng Anh)</option>
              <option value="ja">日本語 (Tiếng Nhật)</option>
              <option value="fr">Français (Tiếng Pháp)</option>
              <option value="zh">中文 (Tiếng Trung)</option>
            </select>

            <label style="font-size: 13px; font-weight: 600; margin-top: 10px;"><i class="fa-solid fa-wand-magic-sparkles"></i> Trang Trí Khung Đại Diện (Discord Avatar Frame):</label>
            <select id="decoSelect" class="win11-input" onchange="changeDecoration(this.value)">
              <option value="none">Mặc định (Không dùng khung)</option>
              <option value="bunny">Tai Thỏ Cute (Bunny Ears)</option>
              <option value="star">Ngôi Sao Lấp Lánh (Star Sparkles)</option>
            </select>

            <label style="font-size: 13px; font-weight: 600; margin-top: 10px;"><i class="fa-solid fa-eye"></i> Hiệu Ứng Lầm Mờ (Blur Glass):</label>
            <button class="win11-btn" style="background: #334155;" onclick="toggleBlurEffect()">Bật / Tắt Làm Mờ</button>

            <button class="win11-btn" style="background: #ef4444; margin-top: 10px;" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
          </div>

          <!-- Mod Tools -->
          <div id="modToolsSection" style="display: none; background: rgba(0,0,0,0.25); border: 1px solid var(--win11-border); padding: 16px; border-radius: 12px; flex-direction: column; gap: 12px;">
            <h4 style="font-size: 14px; color: #f59e0b;"><i class="fa-solid fa-shield-halved"></i> Moderator Tools</h4>
            <div id="adminUserList" style="display: flex; flex-direction: column; gap: 8px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTTOM TASKBAR HOVER -->
    <div class="bottom-taskbar" id="bottomTaskbar" style="display: none;">
      <button class="taskbar-item active" onclick="switchNav('chat')">
        <i class="fa-solid fa-comments"></i>
        <span class="taskbar-label">Phòng Chat</span>
      </button>
      <button class="taskbar-item" onclick="switchNav('profile')">
        <i class="fa-solid fa-id-card"></i>
        <span class="taskbar-label">Hồ Sơ</span>
      </button>
      <button class="taskbar-item" onclick="switchNav('friends')">
        <i class="fa-solid fa-user-group"></i>
        <span class="taskbar-label">Bạn Bè</span>
      </button>
      <button class="taskbar-item" onclick="switchNav('settings')">
        <i class="fa-solid fa-gear"></i>
        <span class="taskbar-label">Cài Đặt</span>
      </button>
    </div>
  </div>

  <!-- MODAL CROP AVATAR KHUNG TRÒN -->
  <div id="cropModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="font-size: 15px; color: #fff;"><i class="fa-solid fa-crop-simple"></i> Cắt Avatar Khung Tròn</h3>
      <input type="file" id="cropFileInput" accept="image/*" class="win11-input" style="margin-top: 10px;" onchange="loadCropImage(event)">
      <div style="width: 100%; height: 250px; background: #000; margin: 12px 0; border-radius: 8px; overflow: hidden;">
        <img id="cropImageTarget" src="" style="max-width: 100%;">
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="win11-btn" style="flex: 1; background: #64748b;" onclick="closeModal('cropModal')">Hủy</button>
        <button class="win11-btn" style="flex: 1;" onclick="applyCroppedAvatar()">Áp Dụng</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let me = null;
    let cropper = null;
    let currentReplyTo = null;
    let blurEnabled = true;

    function showToast(text, icon = 'fa-circle-check') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'win11-toast';
      toast.innerHTML = `<i class="fa-solid ${icon}" style="color: #38bdf8;"></i> <span>${text}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    fetch('/api/me').then(r => r.json()).then(user => {
      if (user) { me = user; showMainApp(); }
    });

    function showMainApp() {
      document.getElementById('paneAuth').classList.remove('active');
      document.getElementById('bottomTaskbar').style.display = 'flex';
      switchNav('chat');
      updateProfileUI();

      socket.emit('user_online', me);
      if (me.role === 'owner' || me.role === 'mod') {
        document.getElementById('modToolsSection').style.display = 'flex';
        loadAdminUserList();
      }
    }

    function switchAuthTab(tab) {
      document.getElementById('btnAuthLogin').style.background = tab==='login' ? 'var(--win11-accent)' : 'transparent';
      document.getElementById('btnAuthReg').style.background = tab==='reg' ? 'var(--win11-accent)' : 'transparent';
      document.getElementById('formLogin').style.display = tab==='login' ? 'flex' : 'none';
      document.getElementById('formReg').style.display = tab==='reg' ? 'flex' : 'none';
    }

    function switchNav(pane) {
      document.querySelectorAll('.taskbar-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

      if (pane === 'chat') {
        document.querySelectorAll('.taskbar-item')[0].classList.add('active');
        document.getElementById('paneChat').classList.add('active');
      } else if (pane === 'profile') {
        document.querySelectorAll('.taskbar-item')[1].classList.add('active');
        document.getElementById('paneProfile').classList.add('active');
      } else if (pane === 'friends') {
        document.querySelectorAll('.taskbar-item')[2].classList.add('active');
        document.getElementById('paneFriends').classList.add('active');
        renderFriendsList();
      } else if (pane === 'settings') {
        document.querySelectorAll('.taskbar-item')[3].classList.add('active');
        document.getElementById('paneSettings').classList.add('active');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      }).then(r => r.json()).then(d => {
        if(d.success) { me = d.user; showMainApp(); showToast('Đăng nhập thành công!'); }
        else showToast(d.error, 'fa-triangle-exclamation');
      });
    }

    function handleRegister(e) {
      e.preventDefault();
      fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('regUser').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPass').value
        })
      }).then(r => r.json()).then(d => {
        if(d.success) { me = d.user; showMainApp(); showToast('Tạo tài khoản thành công!'); }
        else showToast(d.error, 'fa-triangle-exclamation');
      });
    }

    function handleLogout() {
      fetch('/api/logout').then(() => location.reload());
    }

    function updateProfileUI() {
      if(!me) return;
      document.getElementById('myAvatarDisplay').src = me.avatar;
      document.getElementById('myUsernameDisplay').innerText = me.username;
      document.getElementById('myEmailDisplay').innerText = me.email;
      document.getElementById('editUsernameInput').value = me.username;
      document.getElementById('editBioInput').value = me.bio || '';

      if (me.banner) {
        document.getElementById('myBannerDisplay').style.backgroundImage = `url(${me.banner})`;
      }
    }

    function handleBannerSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const bannerUrl = evt.target.result;
          fetch('/api/update-profile', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ banner: bannerUrl })
          }).then(r => r.json()).then(d => {
            if(d.success) {
              me = d.user;
              updateProfileUI();
              showToast('Cập nhật ảnh bìa thành công!');
            }
          });
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProfileChanges() {
      fetch('/api/update-profile', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('editUsernameInput').value,
          bio: document.getElementById('editBioInput').value
        })
      }).then(r => r.json()).then(d => {
        if(d.success) { me = d.user; updateProfileUI(); showToast('Đã lưu hồ sơ!'); }
      });
    }

    function openCropModal() { document.getElementById('cropModal').style.display = 'flex'; }
    function loadCropImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = document.getElementById('cropImageTarget');
          img.src = evt.target.result;
          if (cropper) cropper.destroy();
          cropper = new Cropper(img, { aspectRatio: 1, viewMode: 1 });
        };
        reader.readAsDataURL(file);
      }
    }

    function applyCroppedAvatar() {
      if (cropper) {
        const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
        fetch('/api/update-profile', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ avatar: canvas.toDataURL('image/png') })
        }).then(r => r.json()).then(d => {
          if(d.success) { me = d.user; updateProfileUI(); closeModal('cropModal'); showToast('Đã đổi avatar!'); }
        });
      }
    }

    function toggleBlurEffect() {
      blurEnabled = !blurEnabled;
      document.documentElement.style.setProperty('--win11-blur', blurEnabled ? '30px' : '0px');
      showToast(blurEnabled ? 'Đã bật làm mờ' : 'Đã tắt làm mờ');
    }

    function changeLanguage(lang) {
      const titles = {
        vi: 'Global Chat Application - Ultimate Glass',
        en: 'Global Chat Application - Ultimate Glass',
        ja: 'グローバルチャットアプリケーション',
        fr: 'Application de Chat Global',
        zh: '全球匿名聊天应用程序'
      };
      document.getElementById('txtTitle').innerText = titles[lang] || titles.vi;
      showToast(`Đã chuyển ngôn ngữ: ${lang.toUpperCase()}`);
    }

    function renderMsg(msg) {
      const box = document.getElementById('msgBox');
      const card = document.createElement('div');
      card.className = 'msg-card';

      card.innerHTML = `
        <img src="${msg.avatar}" class="avatar">
        <div class="msg-body">
          <div style="font-size: 12px; font-weight: 700; color: #38bdf8;">${msg.user}</div>
          <div style="font-size: 13px; color: #f1f5f9;">${msg.text}</div>
        </div>
      `;
      box.appendChild(card);
      box.scrollTop = box.scrollHeight;
    }

    socket.on('load_history', h => {
      document.getElementById('msgBox').innerHTML = '';
      h.forEach(m => renderMsg(m));
    });

    socket.on('receive_message', m => renderMsg(m));

    socket.on('update_online_list', (users) => {
      document.getElementById('onlineCount').innerText = users.length;
      document.getElementById('onlineUsersList').innerHTML = users.map(u => `
        <div style="font-size: 12px; font-weight: 600;">${u.username}</div>
      `).join('');
    });

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if (input.value.trim() && me) {
        socket.emit('send_message', {
          userId: me.id,
          user: me.username,
          role: me.role,
          avatar: me.avatar,
          text: input.value
        });
        input.value = '';
      }
    }

    function renderFriendsList() {
      const container = document.getElementById('friendsList');
      container.innerHTML = me && me.friends && me.friends.length > 0
        ? me.friends.map(f => `<div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">ID Bạn Bè: ${f}</div>`).join('')
        : `<p style="font-size: 13px; color: #94a3b8;">Chưa có bạn bè nào.</p>`;
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  </script>
</body>
</html>
